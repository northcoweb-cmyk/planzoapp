<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Match</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="viewport">
  <div id="cam">
    <div id="night" class="full"><div class="glowb" id="gA"></div><div class="glowb" id="gB"></div><div class="glowb" id="gC"></div></div>
    <div id="shots"></div>
  </div>
  <div class="fill" id="leak"></div>
  <div class="fill" id="flash"></div>
  <div class="fill" id="vig"></div>
  <canvas id="grain" width="540" height="675"></canvas>
</div>
<div id="player"><button id="pp">Play</button><input id="scrub" type="range" min="0" max="25" step="0.001" value="0"><span id="tc">0.00s</span></div>
<audio id="aud" src="audio/mix.wav" preload="auto"></audio>
<script src="scene.js"></script>
</body>
</html>
