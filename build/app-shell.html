body{background:var(--bg-2);padding-bottom:calc(84px + env(safe-area-inset-bottom))}

.tabbar{

}
.tab{background:none;border:0;padding:7px 1px;border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:600;color:var(--ink-4);min-height:52px}
.tab[aria-current="true"]{color:var(--brand)}
.tab .ic{font-size:18px;line-height:1}
.tab.create .ic{width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:21px;box-shadow:var(--sh-brand);margin-top:-8px}
code{background:var(--bg-3);padding:2px 6px;border-radius:6px;font-size:.9em}

     · adaptive questions and the group decision engine

     · multi-day trips · groups and group memory
     · personal memory with confidence and stability
     · events, RSVPs, capacity, roles and permissions
     · Planzo tickets with a real QR, and door check-in
     · expense splitting and settle-up
     · calendar export (.ics) and reminders
     · natural-language search · live weather (Open-Meteo, free, keyless)

     · a link your friends open on their own phones — there is nowhere for

     · venue search — Google Places needs a server-side key, and shipping
