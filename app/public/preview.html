<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planzo — Preview</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(1200px 800px at 50% -10%, #1b1530 0%, #0b0b12 55%, #08080d 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #fff;
  }
  .wrap {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 40px 16px;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; color: rgba(255,255,255,.55); }
  h1 b { color: #fff; font-weight: 700; }

  /* iPhone 15 frame: 393x852 logical pt viewport, scaled to fit. */
  .device {
    position: relative;
    width: 393px; height: 852px;
    background: #1a1a1e;
    border-radius: 55px;
    padding: 14px;
    box-shadow:
      0 0 0 3px #38383d,
      0 0 0 5px #0d0d0f,
      0 30px 70px -15px rgba(0,0,0,.7),
      0 10px 30px rgba(0,0,0,.5);
    flex: 0 0 auto;
  }
  .screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 42px;
    overflow: hidden;
    background: #000;
  }
  .screen iframe {
    width: 100%; height: 100%; border: 0; display: block;
    background: #0B0B12;
  }
  .notch {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px;
    background: #000;
    border-radius: 20px;
    z-index: 5;
    pointer-events: none;
  }
  .sidebtn {
    position: absolute; width: 4px; background: #0d0d0f; border-radius: 2px;
  }
  .sidebtn.mute   { left: -4px; top: 108px; height: 32px; }
  .sidebtn.vol-up { left: -4px; top: 168px; height: 62px; }
  .sidebtn.vol-dn { left: -4px; top: 240px; height: 62px; }
  .sidebtn.power  { right: -4px; top: 190px; height: 90px; }

  .controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
    max-width: 393px;
  }
  .controls a, .controls button {
    appearance: none; border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06); color: #fff;
    font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 999px;
    cursor: pointer; text-decoration: none; transition: background .15s;
  }
  .controls a:hover, .controls button:hover { background: rgba(255,255,255,.12); }

  @media (max-height: 950px) {
    .device { transform: scale(0.82); margin: -75px 0; }
  }
  @media (max-width: 440px) {
    .device { transform: scale(0.86); margin: -60px 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Planzo — <b>live iPhone 15 preview</b></h1>

  <div class="device">
    <div class="notch"></div>
    <div class="sidebtn mute"></div>
    <div class="sidebtn vol-up"></div>
    <div class="sidebtn vol-dn"></div>
    <div class="sidebtn power"></div>
    <div class="screen">
      <iframe id="frame" src="/" title="Planzo app"></iframe>
    </div>
  </div>

  <div class="controls">
    <button id="reload">↻ Reload</button>
    <a href="/" target="_blank" rel="noopener">Open full-screen ↗</a>
  </div>
</div>

<script>
  document.getElementById('reload').onclick = () => {
    const f = document.getElementById('frame');
    f.src = f.src;
  };
</script>
</body>
</html>
