<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viral</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="viewport">
  <div id="cam">
    <div id="night" class="full"><div class="glowb" id="gA"></div><div class="glowb" id="gB"></div><div class="glowb" id="gC"></div></div>
    <div id="world" class="full">
      <canvas id="city" width="1080" height="1350"></canvas>
      <div id="anchor"><div id="phone"><div class="scr">
        <div class="sb"><span>9:41</span><i class="island"></i><span class="sbr"><b class="sig"><i></i><i></i><i></i><i></i></b><b class="bat"></b></span></div>
        <div id="post">
          <div class="hd"><div class="av"><i></i></div><div><div class="nm">coastline.realty</div><div class="lc">Malibu, California</div></div><span class="more">•••</span></div>
          <div class="car"><div id="track"></div><div id="carN" class="mono">1/5</div></div>
          <div class="act"><span id="heart"></span><span class="ico cmt"></span><span class="ico snd"></span><div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i></div><span class="ico sav"></span></div>
          <div class="likes"><b id="likeN">12</b> likes</div>
        </div>
        <div id="inbox"><div class="ih"><div><div class="it">Messages</div><div class="iu">Rachel · coastline.realty</div></div><div class="badge" id="badge">0</div></div><div id="rows"></div></div>
        <div id="sheet"></div>
        <div id="banners"></div>
      </div></div></div>
    </div>
    <div id="shots"></div>
  </div>
  <div class="fill" id="scrim"></div>
  <div id="head" class="serifW"></div>
  <div id="reach" class="mono">REACH <b id="reachN">0</b></div>
  <div id="kick"></div>
  <div class="fill" id="leak"></div>
  <div class="fill" id="flash"></div>
  <div class="fill" id="vig"></div>
  <canvas id="grain" width="540" height="675"></canvas>
</div>
<div id="player"><button id="pp">Play</button><input id="scrub" type="range" min="0" max="21" step="0.001" value="0"><span id="tc">0.00s</span></div>
<audio id="aud" src="audio/mix.wav" preload="auto"></audio>
<script src="scene.js"></script>
</body>
</html>
