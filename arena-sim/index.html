<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena Tycoon</title>
<style>
:root{--bg:#0e1117;--panel:#161b24ee;--line:#2a3242;--text:#e8ecf3;--dim:#8d97a8;--gold:#f0c94a;--good:#3fcf7a;--bad:#ff5c5c;--warn:#ffb340;--accent:#4da3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas#c{display:block;position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;image-rendering:pixelated}
.pnl{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);box-shadow:0 6px 24px #0008}
#top{top:8px;left:8px;right:8px;display:flex;gap:14px;align-items:center;padding:8px 12px;flex-wrap:wrap}
#top .blk{display:flex;flex-direction:column}
#top .lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
#top .val{font-size:17px;font-weight:700}
#cash{color:var(--good)}
#score{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:800;padding:4px 10px;background:#000a;border-radius:6px;border:1px solid #333}
#phase{min-width:190px}
#phbar{height:4px;background:#2a3242;border-radius:2px;margin-top:3px;overflow:hidden}
#phbar i{display:block;height:100%;background:var(--accent);width:0}
.sp{margin-left:auto;display:flex;gap:4px;align-items:center}
button{background:#232b3a;color:var(--text);border:1px solid #34405a;border-radius:6px;padding:6px 10px;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#2c3850}
button.on{background:var(--accent);border-color:var(--accent);color:#04121f}
button:disabled{opacity:.4;cursor:not-allowed}
button.buy{background:#1d3b2a;border-color:#2f6b46}
button.buy:hover{background:#25503a}
#ticker{top:78px;right:8px;width:290px;padding:10px;max-height:calc(100% - 250px);overflow:hidden}
#ticker h3,#alerts h3,#insp h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
#cats{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:8px;font-variant-numeric:tabular-nums}
#cats b{text-align:right}
#feed div{font-size:12px;padding:2px 0;border-bottom:1px dashed #2a3242;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#feed .m{color:var(--good);font-weight:700;float:right}
#feed .x{color:var(--bad)}
#alerts{top:78px;left:8px;width:270px;padding:10px}
#alerts div{font-size:12px;padding:4px 6px;margin-bottom:4px;border-left:3px solid var(--warn);background:#ffb3400f;border-radius:3px}
#alerts div.ok{border-color:var(--good);background:#3fcf7a0f}
#bar{bottom:8px;left:50%;transform:translateX(-50%);padding:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 16px)}
#bar kbd{font-size:10px;color:var(--dim);margin-left:4px}
#mini{bottom:8px;left:8px;padding:4px}
#mini canvas{display:block;border-radius:6px;cursor:pointer}
#hint{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);padding:6px 12px;background:#000c;border-radius:20px;font-weight:600;display:none;pointer-events:none}
#insp{bottom:64px;right:8px;width:310px;padding:12px;display:none}
#insp .x{position:absolute;top:6px;right:8px;cursor:pointer;color:var(--dim);font-size:16px}
#insp h2{margin:0 0 2px;font-size:16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:8px 0;font-variant-numeric:tabular-nums}
.kv span{color:var(--dim)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meter{height:6px;background:#2a3242;border-radius:3px;overflow:hidden;margin-top:2px}
.meter i{display:block;height:100%}
#modalWrap{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20}
#modal{width:min(640px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;padding:18px;position:relative;inset:auto}
#modal h2{margin:0 0 6px}
#modal p{color:#c9d1de}
#modal .choice{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px}
#modal .choice small{display:block;color:var(--dim);font-weight:400}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
td,th{padding:4px 6px;border-bottom:1px solid #2a3242;text-align:right}
td:first-child,th:first-child{text-align:left}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #2a3242}
.row .d{color:var(--dim);font-size:12px}
input[type=range]{width:180px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#2a3242;color:var(--dim);margin-left:6px}
#toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#000d;border:1px solid #444;padding:6px 14px;border-radius:20px;font-weight:600;animation:fade 3.5s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (max-width:900px){#ticker,#alerts{display:none}#mini{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="pnl">
  <div class="blk"><span class="lbl">Cash</span><span class="val" id="cash">$0</span></div>
  <div class="blk"><span class="lbl">Tonight</span><span class="val" id="tonight">$0</span></div>
  <div class="blk"><span class="lbl">Attendance</span><span class="val" id="att">0</span></div>
  <div class="blk"><span class="lbl">Fan Mood</span><span class="val" id="mood">–</span></div>
  <div class="blk"><span class="lbl">Reputation</span><span class="val" id="rep">–</span></div>
  <div class="blk" id="phase"><span class="lbl" id="day">Day 1</span><span class="val" id="phname">Downtime</span><div id="phbar"><i></i></div></div>
  <div id="score">LYNX 0 – 0 BEARS</div>
  <div class="sp">
    <button data-sp="0" title="Pause (Space)">❚❚</button>
    <button data-sp="1" class="on">1×</button>
    <button data-sp="2">2×</button>
    <button data-sp="4">4×</button>
    <button data-sp="8">8×</button>
    <button id="skip" title="Skip to next phase (N)">Skip ▸▸</button>
  </div>
</div>

<div id="alerts" class="pnl"><h3>Operations Alerts</h3><div id="alist"></div></div>
<div id="ticker" class="pnl">
  <h3>Live Sales · This Game</h3>
  <div id="cats"></div>
  <canvas id="spark" width="270" height="44"></canvas>
  <h3 style="margin-top:6px">Register Feed</h3>
  <div id="feed"></div>
</div>

<div id="mini" class="pnl"><canvas id="mm" width="220" height="168"></canvas></div>
<div id="hint"></div>
<div id="insp" class="pnl"><span class="x" id="inspX">✕</span><div id="inspStatic"></div><div id="inspLive"></div></div>

<div id="bar" class="pnl">
  <button data-open="build">Build &amp; Upgrade<kbd>B</kbd></button>
  <button data-open="prices">Prices<kbd>P</kbd></button>
  <button data-open="maint">Maintenance<kbd>M</kbd></button>
  <button data-open="fin">Finances<kbd>F</kbd></button>
  <button id="heat">Fan Mood View<kbd>V</kbd></button>
  <button id="overview">Overview<kbd>O</kbd></button>
  <button data-open="help">Help<kbd>H</kbd></button>
</div>
<div id="toast"></div>
<div id="modalWrap"><div id="modal" class="pnl"></div></div>

<script>
'use strict';
/* =====================================================================
   ARENA TYCOON — walk your hockey arena, watch the game, run the business
   ===================================================================== */
const TAU = Math.PI * 2;
const W = 3000, H = 2300;
const C = { x: 1500, y: 960 };                       // arena centre
const RING = { seatIn: [262, 150], seatOut: [405, 288], conc: [446, 320], stand: [478, 346], wall: [505, 372] };
const RK = { x0: C.x - 200, x1: C.x + 200, y0: C.y - 85, y1: C.y + 85, r: 56 };
const R = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rr = (a, b) => a + R() * (b - a);
const pick = a => a[(R() * a.length) | 0];
const money = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString();
const kmoney = n => Math.abs(n) >= 1e6 ? (n < 0 ? '-' : '') + '$' + (Math.abs(n) / 1e6).toFixed(2) + 'M' : Math.abs(n) >= 1e4 ? (n < 0 ? '-' : '') + '$' + Math.round(Math.abs(n) / 1000) + 'k' : money(n);
const ep = (a, rx, ry) => ({ x: C.x + Math.cos(a) * rx, y: C.y + Math.sin(a) * ry });
const normA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const angOf = (x, y, rx, ry) => Math.atan2((y - C.y) / ry, (x - C.x) / rx);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
let seed = 1337; const srnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const HOME = { name: 'Lakeview Lynx', short: 'LYNX', color: '#d42a44' };
const OPPS = [
  { name: 'Ironwood Bears', short: 'BEARS', color: '#2f63e0' },
  { name: 'Coastal Sharks', short: 'SHARKS', color: '#12a39c' },
  { name: 'Summit Eagles', short: 'EAGLES', color: '#e3901c' },
  { name: 'Granite Rams', short: 'RAMS', color: '#7a55cc' },
  { name: 'Riverside Otters', short: 'OTTERS', color: '#2f9a3f' },
  { name: 'Northgate Wolves', short: 'WOLVES', color: '#7d8a99' },
];
const BASE = { ticket: 50, vip: 160, food: 10, beer: 11, merch: 40, parking: 20 };
const COGS = { food: 0.32, beer: 0.25, merch: 0.45, vip: 0.3 };

const TYPES = {
  hotdog:   { label: 'Hot Dog Stand', cat: 'food',  tag: 'FOOD', color: '#e39a2e', rate: 0.34, cost: 60000, items: ['Hot Dog', 'Pretzel', 'Fries', 'Combo'] },
  pizza:    { label: 'Pizza Kitchen', cat: 'food',  tag: 'PIZZA', color: '#e2662b', rate: 0.30, cost: 70000, items: ['Pizza Slice', 'Wings', 'Combo'] },
  nachos:   { label: 'Nacho Cantina', cat: 'food',  tag: 'TACO', color: '#c9b12b', rate: 0.32, cost: 65000, items: ['Nachos', 'Tacos', 'Churro'] },
  bar:      { label: 'Bar',           cat: 'beer',  tag: 'BAR',  color: '#c99a2a', rate: 0.38, cost: 70000, items: ['Draft Beer', 'Seltzer', 'Cocktail', 'Tall Can'] },
  store:    { label: 'Team Store',    cat: 'merch', tag: 'SHOP', color: '#d42a44', rate: 0.22, cost: 90000, items: ['Jersey', 'Hat', 'Puck', 'Scarf', 'Hoodie'] },
  restroom: { label: 'Restrooms',     cat: 'restroom', tag: 'WC', color: '#5f86b3', rate: 0.75, cost: 50000, items: [] },
  vip:      { label: 'VIP Club Lounge', cat: 'vip', tag: 'VIP',  color: '#b8912f', rate: 0.30, cost: 150000, items: ['Wagyu Slider', 'Champagne', 'Craft Flight'] },
};
const BUILDABLE = ['hotdog', 'pizza', 'nachos', 'bar', 'store', 'restroom'];

// concourse slots: every 15° skipping gate areas
const GATE_A = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
const GATE_N = ['East', 'South (Main)', 'West', 'North'];
const SLOTS = [];
for (let k = 0; k < 24; k++) {
  const deg = 7.5 + 15 * k, a = deg * Math.PI / 180;
  if (GATE_A.some(g => Math.abs(normA(a - g)) < 10 * Math.PI / 180)) continue;
  SLOTS.push(normA(a));
}
const NSEC = 20;
const secCenter = i => -Math.PI / 2 + i * TAU / NSEC;
const secOf = a => ((Math.round(normA(a + Math.PI / 2) / (TAU / NSEC)) % NSEC) + NSEC) % NSEC;

/* ---------------- persistent state ---------------- */
function freshState() {
  return {
    v: 3, cash: 300000, day: 1, rep: 55, hype: 50, w: 0, l: 0, otl: 0,
    capacity: 8000, vipSeats: 400, parking: 480, lotB: false, garage: false,
    lanes: [2, 3, 2, 2], jumbotron: false, crew: 2, marketing: 0, transit: false,
    weather: 0, ice: 92, building: 90, clean: 100,
    prices: { ticket: 55, vip: 175, food: 11, beer: 12, merch: 45, parking: 25 },
    stands: [
      { slot: 0, type: 'hotdog' }, { slot: 2, type: 'restroom' }, { slot: 3, type: 'bar' },
      { slot: 4, type: 'store' }, { slot: 5, type: 'bar' }, { slot: 7, type: 'pizza' },
      { slot: 9, type: 'restroom' }, { slot: 11, type: 'hotdog' }, { slot: 12, type: 'vip' },
      { slot: 14, type: 'bar' },
    ].map(s => ({ ...s, lvl: 1, cond: 85 + (R() * 15 | 0), open: true })),
    history: [], opp: 0, phase: 0, pt: 0,
  };
}
function load() {
  try { const s = JSON.parse(localStorage.getItem('arenaTycoon')); if (s && s.v === 3) { s.phase = 0; s.pt = 0; return s; } } catch (e) {}
  return null;
}
function save() {
  try { localStorage.setItem('arenaTycoon', JSON.stringify(S, (k, v) => k[0] === '_' ? undefined : v)); } catch (e) {}
}
let S = load() || freshState();

/* ---------------- phases ---------------- */
const PH = [
  { k: 'DOWN',   n: 'Downtime · Maintenance', d: 360 },
  { k: 'DOORS',  n: 'Doors Open · Fans Arriving', d: 120 },
  { k: 'P1',     n: '1st Period', d: 300 },
  { k: 'INT1',   n: '1st Intermission', d: 90 },
  { k: 'P2',     n: '2nd Period', d: 300 },
  { k: 'INT2',   n: '2nd Intermission', d: 90 },
  { k: 'P3',     n: '3rd Period', d: 300 },
  { k: 'EGRESS', n: 'Final Horn · Fans Leaving', d: 120 },
];
let ph = 0, pt = 0, speed = 1, T = 0;
const phK = () => PH[ph].k;
const isPeriod = () => phK()[0] === 'P';
const isInt = () => phK().startsWith('INT');
const inGame = () => ph >= 1 && ph <= 7;

/* ---------------- runtime ---------------- */
let agents = [], trash = [], janitors = [], particles = [], traffic = [], stalls = [];
let G = null;        // current game ledger
let heat = false, modalOpen = false, inspected = null, nextEvent = 40, alertsT = 0;
const gates = GATE_A.map((a, i) => ({ i, a, q: [], acc: 0, served: 0 }));
const me = { x: C.x, y: C.y + RING.wall[1] + 70, vx: 0, vy: 0, face: -Math.PI / 2 };
const cam = { x: me.x, y: me.y - 60, z: 1.5, zt: 1.5, follow: true };
const keys = {};

function newLedger() {
  return {
    opp: OPPS[S.opp % OPPS.length], att: 0, vipAtt: 0, turned: 0, carAgents: 0,
    rev: { tickets: 0, vip: 0, parking: 0, food: 0, beer: 0, merch: 0, ads: 0, other: 0 },
    cogs: 0, exp: 0, lostSales: 0, walkaways: 0, spark: [0], sparkT: 0, feed: [], mood: 70,
    eventsCost: 0, eventsGain: 0,
  };
}

/* ---------------- geometry helpers ---------------- */
function slotPos(slot, r = RING.stand) { return ep(SLOTS[slot], r[0], r[1]); }
function concPt(a, lane) { return ep(a, RING.conc[0] + lane, RING.conc[1] + lane * 0.72); }
function ringPath(a1, a2, lane) {
  const d = normA(a2 - a1), n = Math.max(1, Math.ceil(Math.abs(d) / 0.13)), out = [];
  for (let i = 1; i <= n; i++) out.push(concPt(a1 + d * i / n, lane));
  return out;
}
function gateIn(g, lane) { return concPt(GATE_A[g], lane); }
function gateDoor(g) { return ep(GATE_A[g], RING.wall[0] + 4, RING.wall[1] + 4); }
function gateOut(g) { return ep(GATE_A[g], RING.wall[0] + 34, RING.wall[1] + 34); }
function vomPt(a) { return ep(a, RING.seatOut[0] + 6, RING.seatOut[1] + 5); }
function randSeat(sec) {
  const a = secCenter(sec) + rr(-0.42, 0.42) * TAU / NSEC;
  const t = rr(0.06, 0.94);
  return { a, t, x: C.x + Math.cos(a) * lerp(RING.seatIn[0], RING.seatOut[0], t), y: C.y + Math.sin(a) * lerp(RING.seatIn[1], RING.seatOut[1], t) };
}

/* ---------------- parking ---------------- */
function buildStalls() {
  stalls = [];
  for (let p = 0; p < 6; p++) for (let row = 0; row < 2; row++) for (let c = 0; c < 40; c++)
    stalls.push({ x: 975 + c * 26, y: 1510 + p * 82 + row * 26, lot: 'A', car: null });
  if (S.lotB) for (let p = 0; p < 6; p++) for (let row = 0; row < 2; row++) for (let c = 0; c < 18; c++)
    stalls.push({ x: 2225 + c * 26, y: 1510 + p * 82 + row * 26, lot: 'B', car: null });
  if (S.garage) for (let i = 0; i < 400; i++) stalls.push({ x: 2350 + (i % 20) * 9, y: 520 + ((i / 20) | 0) * 9, lot: 'G', car: null, hidden: true });
}
const TRANSIT = { x: 560, y: 900 };

/* ====================================================================
   CITY (pre-rendered)
   ==================================================================== */
const roadsX = [250, 850, 2150, 2750], roadsY = [330, 1430, 2080], RW = 56;
let cityCv = null;
const LABELS = [];
function buildCity() {
  seed = 1337; LABELS.length = 0; BLDS.length = 0; TREES.length = 0;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  c.fillStyle = '#3f5a37'; c.fillRect(0, 0, W, H);
  // river
  c.fillStyle = '#2b5f86'; c.fillRect(0, 2140, W, 200);
  c.fillStyle = '#3a7099'; for (let x = 0; x < W; x += 40) c.fillRect(x + srnd() * 20, 2170 + srnd() * 100, 18, 2);
  c.fillStyle = '#8a8170'; c.fillRect(0, 2128, W, 12);
  // blocks with buildings
  const xs = [0, ...roadsX, W], ys = [0, ...roadsY, 2128];
  for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) {
    const bx = xs[i] + (i ? RW / 2 : 0), by = ys[j] + (j ? RW / 2 : 0);
    const bw = xs[i + 1] - (i < xs.length - 2 ? RW / 2 : 0) - bx, bh = ys[j + 1] - (j < ys.length - 2 ? RW / 2 : 0) - by;
    if (bw <= 0 || bh <= 0) continue;
    // sidewalk
    c.fillStyle = '#9b9a95'; c.fillRect(bx, by, bw, bh);
    const ix = bx + 10, iy = by + 10, iw = bw - 20, ih = bh - 20;
    const isArena = i === 2 && j === 1, isLot = i === 2 && j === 2, isLotB = i === 3 && j === 2, isWest = i === 1 && j === 1;
    if (isArena) { // plaza
      c.fillStyle = '#b9b5ab'; c.fillRect(ix, iy, iw, ih);
      c.strokeStyle = '#a7a398'; c.lineWidth = 1;
      for (let x = ix; x < ix + iw; x += 30) { c.beginPath(); c.moveTo(x, iy); c.lineTo(x, iy + ih); c.stroke(); }
      for (let y = iy; y < iy + ih; y += 30) { c.beginPath(); c.moveTo(ix, y); c.lineTo(ix + iw, y); c.stroke(); }
      for (let k = 0; k < 26; k++) tree(c, ix + 20 + srnd() * iw * 0.12 + (k % 2) * iw * 0.86, iy + 30 + srnd() * (ih - 60));
      continue;
    }
    if (isLot) { lotSurface(c, ix, iy, iw, ih, 'LOT A'); continue; }
    if (isLotB) {
      if (S.lotB) lotSurface(c, ix, iy, iw, ih, 'LOT B');
      else { c.fillStyle = '#5b6b45'; c.fillRect(ix, iy, iw, ih); c.fillStyle = '#ffffff55'; c.font = 'bold 22px system-ui'; c.textAlign = 'center'; c.fillText('VACANT LOT · buy to expand parking', ix + iw / 2, iy + ih / 2); }
      continue;
    }
    if (isWest) {
      c.fillStyle = '#7d7f84'; c.fillRect(ix, iy, iw, ih);
      bldg(c, 360, 760, 400, 260, 26, '#5d6d84', 'TRANSIT CENTER', true);
      c.fillStyle = '#c7b56b'; for (let t = 0; t < 6; t++) c.fillRect(380 + t * 62, 1040, 50, 6);
      bldg(c, 330, 420, 230, 260, 70, '#6e5a7a', 'GRAND HOTEL');
      bldg(c, 590, 430, 220, 150, 22, '#7a4b35', 'THE BLUE LINE · SPORTS BAR');
      bldg(c, 590, 610, 220, 110, 30, '#5f6f5f', 'PUB & GRILL');
      bldg(c, 330, 1110, 480, 260, 40, '#5a6170', 'ARENA OFFICES');
      continue;
    }
    // generic city fill
    let y = iy;
    while (y < iy + ih - 40) {
      const rowH = Math.min(iy + ih - y, 90 + srnd() * 130);
      let x = ix;
      while (x < ix + iw - 40) {
        const w = Math.min(ix + iw - x, 80 + srnd() * 160);
        if (srnd() < 0.12) { c.fillStyle = '#4c7040'; c.fillRect(x + 4, y + 4, w - 8, rowH - 8); for (let t = 0; t < 4; t++) tree(c, x + 10 + srnd() * (w - 20), y + 10 + srnd() * (rowH - 20)); }
        else bldg(c, x + 5, y + 5, w - 10, rowH - 10, 10 + srnd() * 90, pick2(['#6b7280', '#7c6f64', '#5f6b7a', '#80766a', '#566070', '#8a7f74', '#6c5f6e', '#59636b']));
        x += w;
      }
      y += rowH;
    }
  }
  // garage
  if (S.garage) bldg(c, 2330, 500, 200, 200, 60, '#4e5562', 'PARKING GARAGE');
  // roads
  c.fillStyle = '#34373d';
  roadsX.forEach(x => c.fillRect(x - RW / 2, 0, RW, 2128));

      const k = b.dataset.b, costs = { seats: 350000, vipx: 300000, jumbo: 250000, crew: 10000, fire: 0, mkt: 30000, lotB: 200000, garage: 600000, transit: 120000 };
      if (S.cash < costs[k]) return;
      S.cash -= costs[k];
      if (k === 'seats') S.capacity += 600; if (k === 'vipx') { S.vipSeats += 200; S.capacity += 200; }
      if (k === 'jumbo') S.jumbotron = true; if (k === 'crew') S.crew++; if (k === 'fire') S.crew--;
      if (k === 'mkt') S.marketing = Math.min(0.45, S.marketing + 0.15);
      if (k === 'lotB') { S.lotB = true; S.parking += 216; buildStalls(); buildCity(); }
      if (k === 'garage') { S.garage = true; S.parking += 400; buildStalls(); buildCity(); }
      if (k === 'transit') { S.transit = true; S.rep += 2; }
      syncJanitors(); toast('Purchased: ' + b.closest('.row').querySelector('b').textContent); save(); openMenu('build');
    }
    const m = e.target.closest('[data-m]');
    if (m) {
      const k = m.dataset.m, mul = down ? 1 : 3;
      const doIt = c => { if (S.cash < c) { toast('Not enough cash'); return false; } S.cash -= c; return true; };
      if (k === 'ice' && doIt(15000)) S.ice = 100;
      if (k === 'bld' && doIt((100 - S.building) * 600 * mul)) S.building = 100;
      if (k === 'clean' && doIt(6000)) trash = [];
      if (k === 'st') { const st = S.stands[+m.dataset.i]; if (doIt(repairCost(st) * mul)) { st.cond = 100; st._brokeEvt = false; } }
      if (k === 'all') {
        let c = 0; if (down) { c += S.ice < 98 ? 15000 : 0; c += trash.length ? 6000 : 0; }
        c += (100 - S.building) * 600 * mul; S.stands.forEach(st => { if (st.cond < 98) c += repairCost(st) * mul; });
        if (doIt(c)) { if (down) { S.ice = 100; trash = []; } S.building = 100; S.stands.forEach(st => { st.cond = 100; st._brokeEvt = false; }); toast('Everything repaired (−' + kmoney(c) + ')'); }
      }
      save(); openMenu('maint');
    }
  };
  M.oninput = e => {
    const k = e.target.dataset.p; if (!k) return;
    if (k === 'ticket' || k === 'vip') { if (inGame()) { toast('Ticket prices lock once doors open'); e.target.value = S.prices[k]; return; } }
    S.prices[k] = +e.target.value; $('pv_' + k).textContent = money(S.prices[k]);
    const f = demandForecast(); const fc = $('fcast'); if (fc) fc.innerHTML = 'Next-game ticket forecast: <b>' + f.demand.toLocaleString() + '</b> (cap ' + S.capacity.toLocaleString() + '). Ticket prices lock when doors open.';
    save();
  };
}
function finChart() {
  const c = $('finc'), x = c.getContext('2d'), hs = S.history.slice(-20);
  const keys = [['tickets', '#4da3ff'], ['vip', '#f0c94a'], ['parking', '#9aa4b5'], ['food', '#e39a2e'], ['beer', '#c99a2a'], ['merch', '#d42a44'], ['other', '#7a55cc'], ['ads', '#3fcf7a']];
  const tot = hs.map(h => keys.reduce((s, [k]) => s + (h.rev[k] || 0), 0));
  const mxv = Math.max(...tot, 1), bw = c.width / Math.max(10, hs.length);
  hs.forEach((h, i) => {
    let y = 130;
    keys.forEach(([k, col]) => { const v = (h.rev[k] || 0) / mxv * 115; x.fillStyle = col; x.fillRect(i * bw + 4, y - v, bw - 8, v); y -= v; });
    x.fillStyle = h.profit < 0 ? '#ff5c5c' : '#fff'; x.font = '10px system-ui'; x.textAlign = 'center'; x.fillText(kmoney(h.profit), i * bw + bw / 2, 145);
  });
  x.textAlign = 'left'; keys.forEach(([k, col], i) => { x.fillStyle = col; x.fillRect(i * 74, 0, 8, 8); x.fillStyle = '#ccd'; x.fillText(k, i * 74 + 11, 8); });
}
function showReport(g) {
  modalOpen = true; MW.style.display = 'flex';
  const tr = g.rev.tickets + g.rev.vip, con = g.rev.food + g.rev.beer + g.rev.merch + g.rev.other;
  M.innerHTML = '<h2>Final: ' + HOME.short + ' ' + g.score[0] + ' – ' + g.score[1] + ' ' + g.opp + ' (' + g.res + ')</h2>' +
    '<div class="kv"><span>Attendance</span><b>' + g.att.toLocaleString() + ' / ' + S.capacity.toLocaleString() + '</b><span>Fans turned away (parking)</span><b>' + g.turned + '</b>' +
    '<span>Ticket & VIP revenue</span><b>' + money(tr) + '</b><span>Concessions & store</span><b>' + money(con) + '</b><span>Parking</span><b>' + money(g.rev.parking) + '</b><span>Ads & sponsors</span><b>' + money(g.rev.ads) + '</b>' +
    '<span>Cost of goods sold</span><b style="color:var(--bad)">−' + money(g.cogs) + '</b>' +
    Object.entries(G.expBreak).map(([k, v]) => '<span>' + k + '</span><b style="color:var(--bad)">−' + money(v) + '</b>').join('') +
    '<span>Sales lost to long lines</span><b style="color:var(--warn)">' + money(g.lost) + '</b>' +
    '<span style="font-size:15px;color:var(--text)">Game profit</span><b style="font-size:15px;color:' + (g.profit < 0 ? 'var(--bad)' : 'var(--good)') + '">' + money(g.profit) + '</b>' +
    '<span>Fan mood → Reputation</span><b>' + g.mood + '% → ' + Math.round(S.rep) + '</b></div>' +
    '<p style="color:var(--dim)">Downtime now — fix things up, then hit Skip ▸▸ to open the doors for the next game.</p><div class="btns"><button class="buy" data-close>Back to the arena</button></div>';
  M.onclick = e => { if (e.target.closest('[data-close]')) closeModal(); };
}

/* ====================================================================
   BOOT
   ==================================================================== */
resize(); buildCity(); buildStalls(); initTraffic(); syncJanitors(); setupPlayers();
let lastT = performance.now(), hudT = 0, miniT = 0;
function frame(now) {
  const rdt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  movePlayer(rdt); cam.z += (cam.zt - cam.z) * Math.min(1, rdt * 7);
  if (!modalOpen && speed > 0) step(rdt * speed);
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx * rdt; p.y += p.vy * rdt; p.life -= rdt * (modalOpen ? 0 : Math.max(1, speed)); if (p.life <= 0) particles.splice(i, 1); }
  if (banner) banner.t -= rdt;
  render();
  hudT -= rdt; if (hudT <= 0) { hudT = 0.25; hud(); }
  miniT -= rdt; if (miniT <= 0) { miniT = 0.5; drawMini(); alertsT++; if (alertsT % 2 === 0) alerts(); }
  requestAnimationFrame(frame);
}
function step(simdt) { const n = Math.ceil(simdt / 0.034), h = simdt / n; for (let i = 0; i < n; i++) update(h); }
requestAnimationFrame(frame);
if (!localStorage.getItem('arenaTycoonSeen')) { openMenu('help'); try { localStorage.setItem('arenaTycoonSeen', 1); } catch (e) {} }
// debug / automation hook
window.ARENA = { noEvents: false, S: () => S, sim: s => { const n = Math.ceil(s / 0.034); for (let i = 0; i < n; i++) update(0.034); }, phase: i => enterPhase(i), me, cam, inspect, allThings, openMenu, showEvent, EVT, closeModal, setSpeed, toggleHeat, toggleOverview };
</script>
