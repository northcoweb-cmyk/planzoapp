<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena Tycoon</title>
<style>
:root{--bg:#0e1117;--panel:#161b24ee;--line:#2a3242;--text:#e8ecf3;--dim:#8d97a8;--gold:#f0c94a;--good:#3fcf7a;--bad:#ff5c5c;--warn:#ffb340;--accent:#4da3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas#c{display:block;position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;image-rendering:pixelated}
.pnl{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);box-shadow:0 6px 24px #0008}
#top{top:8px;left:8px;right:8px;display:flex;gap:14px;align-items:center;padding:8px 12px;flex-wrap:wrap}
#top .blk{display:flex;flex-direction:column}
#top .lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
#top .val{font-size:17px;font-weight:700}
#cash{color:var(--good)}
#score{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:800;padding:4px 10px;background:#000a;border-radius:6px;border:1px solid #333}
#phase{min-width:190px}
#phbar{height:4px;background:#2a3242;border-radius:2px;margin-top:3px;overflow:hidden}
#phbar i{display:block;height:100%;background:var(--accent);width:0}
.sp{margin-left:auto;display:flex;gap:4px;align-items:center}
button{background:#232b3a;color:var(--text);border:1px solid #34405a;border-radius:6px;padding:6px 10px;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#2c3850}
button.on{background:var(--accent);border-color:var(--accent);color:#04121f}
button:disabled{opacity:.4;cursor:not-allowed}
button.buy{background:#1d3b2a;border-color:#2f6b46}
button.buy:hover{background:#25503a}
#ticker{top:78px;right:8px;width:300px;padding:10px;max-height:calc(100% - 250px);overflow:hidden}
#tabs{display:flex;gap:6px;margin-bottom:8px}#tabs button{flex:1;padding:4px 8px;font-size:12px}#buzzdot{font-size:9px;color:#8d97a8}
.post{display:flex;gap:7px;padding:6px 0;border-bottom:1px solid #2a3242;font-size:12px}
.av{flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff}
.post b{font-size:12px}.post .h{color:var(--dim);font-size:11px}.post .t{margin:1px 0 2px;line-height:1.3}.post .m{color:var(--dim);font-size:10.5px}
.tagc{display:inline-block;margin:0 4px 3px 0;padding:1px 6px;border-radius:9px;background:#2a3242;font-size:10.5px;color:#8fc4ff}
.sbar{height:7px;border-radius:4px;overflow:hidden;background:#ff5c5c;margin:3px 0 6px}.sbar i{display:block;height:100%;background:#3fcf7a}
#ticker h3,#alerts h3,#insp h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
#cats{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:8px;font-variant-numeric:tabular-nums}
#cats b{text-align:right}
#feed div{font-size:12px;padding:2px 0;border-bottom:1px dashed #2a3242;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#feed .m{color:var(--good);font-weight:700;float:right}
#feed .x{color:var(--bad)}
#alerts{top:78px;left:8px;width:270px;padding:10px}
#alerts div{font-size:12px;padding:4px 6px;margin-bottom:4px;border-left:3px solid var(--warn);background:#ffb3400f;border-radius:3px}
#alerts div.ok{border-color:var(--good);background:#3fcf7a0f}
#bar{bottom:8px;left:50%;transform:translateX(-50%);padding:6px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 16px)}
#bar kbd{font-size:10px;color:var(--dim);margin-left:4px}
#mini{bottom:8px;left:8px;padding:4px}
#mini canvas{display:block;border-radius:6px;cursor:pointer}
#hint{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);padding:6px 12px;background:#000c;border-radius:20px;font-weight:600;display:none;pointer-events:none}
#insp{bottom:64px;right:8px;width:310px;padding:12px;display:none}
#insp .x{position:absolute;top:6px;right:8px;cursor:pointer;color:var(--dim);font-size:16px}
#insp h2{margin:0 0 2px;font-size:16px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:8px 0;font-variant-numeric:tabular-nums}
.kv span{color:var(--dim)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meter{height:6px;background:#2a3242;border-radius:3px;overflow:hidden;margin-top:2px}
.meter i{display:block;height:100%}
#modalWrap{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20}
#modal{width:min(640px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;padding:18px;position:relative;inset:auto}
#modal h2{margin:0 0 6px}
#modal p{color:#c9d1de}
#modal .choice{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px}
#modal .choice small{display:block;color:var(--dim);font-weight:400}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
td,th{padding:4px 6px;border-bottom:1px solid #2a3242;text-align:right}
td:first-child,th:first-child{text-align:left}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #2a3242}
.row .d{color:var(--dim);font-size:12px}
input[type=range]{width:180px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#2a3242;color:var(--dim);margin-left:6px}
#toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);z-index:15;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#000d;border:1px solid #444;padding:6px 14px;border-radius:20px;font-weight:600;animation:fade 3.5s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (max-width:900px){#ticker,#alerts{display:none}#mini{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="pnl">
  <div class="blk"><span class="lbl">Cash</span><span class="val" id="cash">$0</span></div>
  <div class="blk"><span class="lbl">Tonight</span><span class="val" id="tonight">$0</span></div>
  <div class="blk"><span class="lbl">Attendance</span><span class="val" id="att">0</span></div>
  <div class="blk"><span class="lbl">Fan Mood</span><span class="val" id="mood">–</span></div>
  <div class="blk"><span class="lbl">Reputation</span><span class="val" id="rep">–</span></div>
  <div class="blk" id="phase"><span class="lbl" id="day">Day 1</span><span class="val" id="phname">Downtime</span><div id="phbar"><i></i></div></div>
  <canvas id="logoC" width="30" height="30" style="width:30px;height:30px"></canvas>
  <div id="score">LYNX 0 – 0 BEARS</div>
  <div class="sp">
    <button data-sp="0" title="Pause (Space)">❚❚</button>
    <button data-sp="1" class="on">1×</button>
    <button data-sp="2">2×</button>
    <button data-sp="4">4×</button>
    <button data-sp="8">8×</button>
    <button id="skip" title="Skip to next phase (N)">Skip ▸▸</button>
  </div>
</div>

<div id="alerts" class="pnl"><h3>Operations Alerts</h3><div id="alist"></div></div>
<div id="ticker" class="pnl">
  <div id="tabs"><button data-tab="sales" class="on">Sales</button><button data-tab="social">Chirp <span id="buzzdot">●</span></button></div>
  <div id="salesView">
    <h3>Live Sales · This Game</h3>
    <div id="cats"></div>
    <canvas id="spark" width="270" height="44"></canvas>
    <h3 style="margin-top:6px">Register Feed</h3>
    <div id="feed"></div>
  </div>
  <div id="socialView" style="display:none"></div>
</div>

<div id="mini" class="pnl"><canvas id="mm" width="220" height="168"></canvas></div>
<div id="hint"></div>
<div id="insp" class="pnl"><span class="x" id="inspX">✕</span><div id="inspStatic"></div><div id="inspLive"></div></div>

<div id="bar" class="pnl">
  <button data-open="build">Build &amp; Upgrade<kbd>B</kbd></button>
  <button data-open="prices">Prices<kbd>P</kbd></button>
  <button data-open="maint">Maintenance<kbd>M</kbd></button>
  <button data-open="fin">Finances<kbd>F</kbd></button>
  <button id="heat">Fan Mood View<kbd>V</kbd></button>
  <button id="overview">Overview<kbd>O</kbd></button>
  <button id="lvl">Levels<kbd>L</kbd></button>
  <button id="socialBtn">Chirp<kbd>K</kbd></button>
  <button data-open="help">Help<kbd>H</kbd></button>
</div>
<div id="toast"></div>
<div id="modalWrap"><div id="modal" class="pnl"></div></div>

<script src="sim.js"></script>
<script src="render.js"></script>
<script src="ui.js"></script>

</body>
</html>
