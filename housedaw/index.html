<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HouseDAW — make house music in your browser</title>
<meta name="description" content="A self-contained browser DAW for house music with a built-in procedural sound library, synths, drum machine, mixer, effects, AI producer and WAV/MP3 export. No samples, no accounts, works offline.">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="splash">Building the sound library…</div>
<div id="app">
  <header id="topbar"></header>
  <div id="main">
    <aside id="browser"></aside>
    <section id="center">
      <div id="arrange"><div id="tl" class="tl"></div></div>
      <div id="resizer" title="Drag to resize · double-click to collapse"></div>
      <div id="dock"></div>
    </section>
    <aside id="right"></aside>
  </div>
</div>
<script src="js/util.js"></script>
<script src="js/dsp.js"></script>
<script src="js/lib.js"></script>
<script src="js/presets.js"></script>
<script src="js/music.js"></script>
<script src="js/state.js"></script>
<script src="js/fx.js"></script>
<script src="js/instruments.js"></script>
<script src="js/engine.js"></script>
<script src="js/analysis.js"></script>
<script src="js/mix.js"></script>
<script src="js/transport.js"></script>
<script src="js/export.js"></script>
<script src="js/store.js"></script>
<script src="js/compose.js"></script>
<script src="js/actions.js"></script>
<script src="js/ai.js"></script>
<script src="js/import.js"></script>
<script src="js/gen.js"></script>
<script src="js/packs.js"></script>
<script src="js/ui-core.js"></script>
<script src="js/ui-browser.js"></script>
<script src="js/ui-timeline.js"></script>
<script src="js/ui-pianoroll.js"></script>
<script src="js/ui-drum.js"></script>
<script src="js/ui-mixer.js"></script>
<script src="js/ui-device.js"></script>
<script src="js/ui-panels.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
