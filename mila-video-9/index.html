<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="viewport">
  <div class="fill" id="bgGlow"><div class="glowb" id="gA"></div><div class="glowb" id="gB"></div><div class="glowb" id="gC"></div></div>
  <div class="fill" id="grid"></div>
  <canvas id="stars" width="1080" height="1350"></canvas>

  <div id="cam">
    <!-- HOOK: the overloaded agent "system" -->
    <div id="os" class="dglass">
      <div class="tbar"><i></i><i></i><i></i><span>agent_os · v1.0 · not responding</span></div>
      <div class="meter" style="top:80px"><span>CPU</span><div class="bar"><i id="cpu"></i></div><b id="cpuN">100%</b></div>
      <div class="meter" style="top:132px"><span>MEMORY</span><div class="bar"><i id="mem"></i></div><b id="memN">99%</b></div>
      <div id="warns"></div>
    </div>

    <!-- the update -->
    <div id="upd" class="dglass">
      <div id="updHd"><div class="mIcon"><span>M</span></div><div><div class="t1">Update available</div><div class="t2">Mila · Patch 2.0</div></div></div>
      <div id="notesHd">PATCH NOTES</div>
      <div id="notes"></div>
      <div id="install"><b></b><span id="instTxt">Install</span></div>
    </div>

    <!-- installing -->
    <div id="inst">
      <div id="instLbl">INSTALLING MILA · PATCH 2.0</div>
      <div id="pct">0%</div>
      <div id="pbar"><i></i></div>
      <div id="plog"></div>
    </div>

    <!-- the patched workflow -->
    <div id="net">
      <svg id="wires" width="1080" height="1350" style="position:absolute;left:0;top:0"></svg>
      <div id="runLbl">PATCH 2.0 · RUNNING FOR RACHEL</div>
      <div id="coreRing"></div>
      <div id="core" class="mIcon"><span>M</span></div>
      <div id="nodes"></div>
      <div id="cards"></div>
    </div>

    <div id="words" class="abs"></div>

    <div id="endc" class="abs" style="width:1080px;height:1350px">
      <div id="wordmark">Mila</div>
      <div id="tagline"><div class="ln"><span>Your AI operations manager for real estate.</span></div></div>
      <div id="cta"><div class="ln"><span>Comment <span class="q">“Mila”</span></span></div><div class="ln"><span>for a 7-day free trial.</span></div></div>
    </div>
  </div>

  <div class="fill" id="slices"></div>
  <div class="fill" id="flash"></div>
  <div class="fill" id="scan"></div>
  <div class="fill" id="vig"></div>
  <canvas id="grain" width="540" height="675"></canvas>
</div>
<div id="player"><button id="pp">Play</button><input id="scrub" type="range" min="0" max="18.5" step="0.001" value="0"><span id="tc">0.00s</span></div>
<audio id="aud" src="audio/mix.wav" preload="auto"></audio>
<script src="scene.js"></script>
</body>
</html>
