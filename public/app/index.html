<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planzo</title>
<meta name="theme-color" content="#6366F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planzo">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/planzo.css">
<style>
body{background:var(--bg-2);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.screen{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) var(--pad) 20px}
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.86);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid rgba(230,231,240,.9);
  display:grid;grid-template-columns:repeat(6,1fr);gap:1px;
}
.tab{background:none;border:0;padding:7px 1px;border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:600;color:var(--ink-4);min-height:52px}
.tab[aria-current="true"]{color:var(--brand)}
.tab .ic{font-size:18px;line-height:1}
.tab.create .ic{width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:21px;box-shadow:var(--sh-brand);margin-top:-8px}
code{background:var(--bg-3);padding:2px 6px;border-radius:6px;font-size:.9em}
</style>
</head>
<body>
<main id="view" class="screen"></main>
<nav class="tabbar" role="tablist">
  <button class="tab" data-tab="home"><span class="ic">&#8962;</span>Home</button>
  <button class="tab" data-tab="discover"><span class="ic">&#9678;</span>Discover</button>
  <button class="tab create" data-tab="create"><span class="ic">+</span>Plan</button>
  <button class="tab" data-tab="plans"><span class="ic">&#8801;</span>Plans</button>
  <button class="tab" data-tab="events"><span class="ic">&#9733;</span>Events</button>
  <button class="tab" data-tab="profile"><span class="ic">&#9677;</span>You</button>
</nav>
<script src="/qr.js"></script>
<script src="/plan-render.js"></script>
<script src="/app/backend-http.js"></script>
<script src="/app/app.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/app/sw.js').catch(() => {});
</script>
</body>
</html>
